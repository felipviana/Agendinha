<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Redefinir senha</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/theme.css?v=3">

    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-card {
            width: 100%;
            max-width: 460px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            background: #ffffff;
        }

        .dark-mode body {
            background:
                radial-gradient(circle at top left, rgba(59,130,246,0.14), transparent 30%),
                radial-gradient(circle at top right, rgba(236,72,153,0.10), transparent 28%),
                #0f172a;
            color: #e5e7eb;
        }

        .dark-mode .auth-card {
            background-color: #1e293b !important;
            color: #e5e7eb !important;
            border-color: #334155 !important;
            box-shadow: 0 18px 40px rgba(0,0,0,0.35);
        }

        .dark-mode .form-label,
        .dark-mode .text-muted,
        .dark-mode p,
        .dark-mode span,
        .dark-mode a,
        .dark-mode h1 {
            color: #e5e7eb !important;
        }

        .dark-mode .form-control {
            background-color: #0f172a !important;
            border-color: #334155 !important;
            color: #e5e7eb !important;
        }

        .dark-mode .form-control::placeholder {
            color: #94a3b8 !important;
        }

        .dark-mode .form-control:focus {
            background-color: #0f172a !important;
            color: #e5e7eb !important;
            border-color: #60a5fa !important;
            box-shadow: 0 0 0 0.2rem rgba(96,165,250,0.2) !important;
        }

        .dark-mode .invalid-feedback {
            color: #fca5a5 !important;
        }
    </style>
</head>
<body class="bg-light">
    <div id="toast-root"></div>

    <div class="auth-wrapper">
        <div class="card auth-card">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="mb-0">Redefinir senha</h1>

                    <div class="theme-switch-wrapper">
                        <span class="theme-icon">☀️</span>
                        <label class="theme-switch">
                            <input type="checkbox" id="themeToggle">
                            <span class="theme-slider"></span>
                        </label>
                        <span class="theme-icon">🌙</span>
                    </div>
                </div>

                <p class="text-muted mb-4">
                    Defina sua nova senha.
                </p>

                <form id="resetPasswordForm">
                    <input type="hidden" id="token">

                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" id="email" class="form-control" placeholder="seuemail@exemplo.com">
                        <div class="invalid-feedback d-block" id="error-email"></div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Nova senha</label>
                        <input type="password" id="password" class="form-control" placeholder="Digite sua nova senha">
                        <div class="invalid-feedback d-block" id="error-password"></div>
                    </div>

                    <div class="mb-3">
                        <label for="password_confirmation" class="form-label">Confirmar senha</label>
                        <input type="password" id="password_confirmation" class="form-control" placeholder="Repita sua nova senha">
                        <div class="invalid-feedback d-block" id="error-password_confirmation"></div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100" id="resetPasswordButton">
                        Redefinir senha
                    </button>

                    <div class="text-center mt-3">
                        <a href="login.html">Voltar para o login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../assets/js/theme.js?v=3"></script>
    <script src="../assets/js/ui.js?v=3"></script>
    <script src="../assets/js/auth.js?v=3"></script>
    <script>
        function getParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                token: params.get('token') || '',
                email: params.get('email') || ''
            };
        }

        function clearResetErrors() {
            $('#email, #password, #password_confirmation').removeClass('is-invalid');
            $('#error-email').text('');
            $('#error-password').text('');
            $('#error-password_confirmation').text('');
        }

        function setResetFieldError(fieldId, message) {
            $(`#${fieldId}`).addClass('is-invalid');
            $(`#error-${fieldId}`).text(message);
        }

        $(document).ready(function () {
            if (typeof initThemeToggle === 'function') {
                initThemeToggle();
            }

            const { token, email } = getParams();
            $('#token').val(token);
            $('#email').val(email);
        });

        $('#resetPasswordForm').on('submit', function (e) {
            e.preventDefault();

            clearResetErrors();

            const token = $('#token').val();
            const email = $('#email').val().trim();
            const password = $('#password').val();
            const passwordConfirmation = $('#password_confirmation').val();

            let invalid = false;

            if (!email) {
                setResetFieldError('email', 'Informe o e-mail.');
                invalid = true;
            }

            if (!password) {
                setResetFieldError('password', 'Informe a nova senha.');
                invalid = true;
            } else if (password.length < 6) {
                setResetFieldError('password', 'A senha deve ter pelo menos 6 caracteres.');
                invalid = true;
            }

            if (!passwordConfirmation) {
                setResetFieldError('password_confirmation', 'Confirme a nova senha.');
                invalid = true;
            } else if (password !== passwordConfirmation) {
                setResetFieldError('password_confirmation', 'A confirmação de senha não confere.');
                invalid = true;
            }

            if (!token) {
                showAlert('Token de redefinição não encontrado.', 'danger');
                return;
            }

            if (invalid) {
                return;
            }

            $('#resetPasswordButton').prop('disabled', true).text('Salvando...');

            $.ajax({
                url: `${API_BASE_URL}/reset-password`,
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                },
                data: {
                    token,
                    email,
                    password,
                    password_confirmation: passwordConfirmation
                },
                success: function (response) {
                    showAlert(response.message, 'success');

                    setTimeout(function () {
                        window.location.href = 'login.html';
                    }, 1200);
                },
                error: function (xhr) {
                    $('#resetPasswordButton').prop('disabled', false).text('Redefinir senha');

                    if (xhr.responseJSON?.errors) {
                        Object.keys(xhr.responseJSON.errors).forEach(function (field) {
                            const message = xhr.responseJSON.errors[field][0];

                            if (field === 'email' || field === 'password' || field === 'password_confirmation') {
                                setResetFieldError(field, message);
                            }
                        });

                        if (!xhr.responseJSON.errors.email && !xhr.responseJSON.errors.password) {
                            showAlert(getErrorMessage(xhr, 'Erro ao redefinir senha.'), 'danger');
                        }

                        return;
                    }

                    showAlert(getErrorMessage(xhr, 'Erro ao redefinir senha.'), 'danger');
                }
            });
        });
    </script>
</body>
</html>
