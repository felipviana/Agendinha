<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/theme.css?v=20260427-header4">
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="d-flex justify-content-between align-items-start gap-3 mb-4">
                <div>
                    <span class="page-eyebrow">Acesso</span>
                    <h1 class="auth-title">Entrar na sua agenda</h1>
                    <p class="auth-copy">Retome sua organizacao com um ambiente pensado para foco, antecipacao e menos
                        sobrecarga.</p>
                </div>

                <div class="theme-switch-wrapper">
                    <span class="theme-icon" aria-hidden="true">
                        <span class="ui-icon">
                            <svg viewBox="0 0 24 24" fill="none">
                                <circle cx="12" cy="12" r="4.5"></circle>
                                <path
                                    d="M12 2.5v2.5M12 19v2.5M21.5 12H19M5 12H2.5M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8M18.7 18.7l-1.8-1.8M7.1 7.1 5.3 5.3">
                                </path>
                            </svg>
                        </span>
                    </span>
                    <label class="theme-switch">
                        <input type="checkbox" id="themeToggle">
                        <span class="theme-slider"></span>
                    </label>
                    <span class="theme-icon" aria-hidden="true">
                        <span class="ui-icon">
                            <svg viewBox="0 0 24 24" fill="none">
                                <path d="M20 14.2A8.5 8.5 0 0 1 9.8 4 8.5 8.5 0 1 0 20 14.2Z"></path>
                            </svg>
                        </span>
                    </span>
                </div>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" id="email" class="form-control" required>
                    <div class="invalid-feedback d-block" id="error-email"></div>
                </div>

                <div id="resendVerificationWrapper" class="d-none mt-3">
                    <div class="alert alert-warning mb-2">
                        Seu e-mail ainda não foi confirmado.
                    </div>
                    <button type="button" class="btn btn-outline-warning w-100" id="resendVerificationButton">
                        Reenviar e-mail de verificação
                    </button>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" id="password" class="form-control" required>
                    <div class="invalid-feedback d-block" id="error-password"></div>
                </div>

                <button type="submit" class="btn btn-primary w-100" id="loginButton">Entrar</button>
            </form>

            <div class="text-center mt-3">
                <a href="forgot-password.html">Esqueci minha senha</a>
            </div>

            <div class="text-center mt-4">
                <span>Ainda nao tem conta?</span>
                <a href="register.html">Cadastre-se</a>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999;">
        <div id="appToast" class="toast align-items-center border-0" role="alert" aria-live="assertive"
            aria-atomic="true">
            <div class="d-flex">
                <div id="appToastBody" class="toast-body">
                    Mensagem aqui
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Fechar"></button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../assets/js/theme.js?v=20260427-header4"></script>
    <script src="../assets/js/ui.js?v=20260427-header4"></script>
    <script src="../assets/js/auth.js?v=20260427-header4"></script>
    <script>
        $(document).ready(function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            $('#themeToggle').prop('checked', savedTheme === 'dark');

            $('#themeToggle').on('change', function () {
                const newTheme = $(this).is(':checked') ? 'dark' : 'light';

                localStorage.setItem('theme', newTheme);
                document.documentElement.classList.toggle('dark-mode', newTheme === 'dark');

                if (typeof applyTheme === 'function') {
                    applyTheme(newTheme);
                }
            });
            redirectIfAuthenticated();

            $('#loginForm').on('submit', function (e) {
                e.preventDefault();

                clearLoginErrors();
                $('#resendVerificationWrapper').addClass('d-none');

                if (!validateLoginForm()) {
                    return;
                }

                $('#loginButton').prop('disabled', true).text('Entrando...');

                $.ajax({
                    url: `${API_BASE_URL}/login`,
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    data: {
                        email: $('#email').val().trim(),
                        password: $('#password').val()
                    },
                    success: function (response) {
                        saveAuth(response.token, response.user);
                        window.location.href = '../dashboard/index.html';
                    },
                    error: function (xhr) {
                        $('#loginButton').prop('disabled', false).text('Entrar');

                        if (xhr.status === 403) {
                            const message = xhr.responseJSON?.message || 'Confirme seu e-mail antes de fazer login.';
                            showAlert(message, 'warning');
                            $('#resendVerificationWrapper').removeClass('d-none');
                            return;
                        }

                        if (xhr.responseJSON?.errors) {
                            let messages = '';

                            Object.values(xhr.responseJSON.errors).forEach(function (errorArray) {
                                messages += `<div>${errorArray[0]}</div>`;
                            });

                            showAlert(messages, 'danger');
                            return;
                        }

                        showAlert(getErrorMessage(xhr, 'Erro ao realizar login.'), 'danger');
                    }
                });
            });

            $('#resendVerificationButton').on('click', function () {
                const email = $('#email').val().trim();

                if (!email) {
                    showAlert('Informe o e-mail para reenviar a verificação.', 'warning');
                    return;
                }

                $('#resendVerificationButton').prop('disabled', true).text('Reenviando...');

                $.ajax({
                    url: `${API_BASE_URL}/email/resend-verification`,
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    data: { email },
                    success: function (response) {
                        $('#resendVerificationButton').prop('disabled', false).text('Reenviar e-mail de verificação');
                        showAlert(response.message || 'Novo link de verificação enviado com sucesso.', 'success');
                    },
                    error: function (xhr) {
                        $('#resendVerificationButton').prop('disabled', false).text('Reenviar e-mail de verificação');
                        showAlert(getErrorMessage(xhr, 'Erro ao reenviar e-mail de verificação.'), 'danger');
                    }
                });
            });
        });

        function clearLoginErrors() {
            $('#loginForm .form-control').removeClass('is-invalid');
            $('#error-email').text('');
            $('#error-password').text('');
        }

        function setLoginFieldError(fieldId, message) {
            $(`#${fieldId}`).addClass('is-invalid');
            $(`#error-${fieldId}`).text(message);
        }

        function validateLoginForm() {
            clearLoginErrors();

            let isValid = true;

            const email = $('#email').val().trim();
            const password = $('#password').val();

            if (!email) {
                setLoginFieldError('email', 'Informe seu e-mail.');
                isValid = false;
            } else {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    setLoginFieldError('email', 'Informe um e-mail válido.');
                    isValid = false;
                }
            }

            if (!password) {
                setLoginFieldError('password', 'Informe sua senha.');
                isValid = false;
            }

            return isValid;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
