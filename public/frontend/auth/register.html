<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/theme.css?v=20260427-header4">
</head>

<body>
    <div id="toast-root"></div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="d-flex justify-content-between align-items-start gap-3 mb-4">
                <div>
                    <span class="page-eyebrow">Primeiros passos</span>
                    <h1 class="auth-title">Criar conta</h1>
                    <p class="auth-copy">Configure seu espaco para acompanhar compromissos, listas e categorias de forma
                        mais calma e visual.</p>
                </div>
                <div class="theme-switch-wrapper">
                    <span class="theme-icon" aria-hidden="true">
                        <span class="ui-icon">
                            <svg viewBox="0 0 24 24" fill="none">
                                <circle cx="12" cy="12" r="4.5"></circle>
                                <path
                                    d="M12 2.5v2.5M12 19v2.5M21.5 12H19M5 12H2.5M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8M18.7 18.7l-1.8-1.8M7.1 7.1 5.3 5.3">
                                </path>
                            </svg>
                        </span>
                    </span>
                    <label class="theme-switch">
                        <input type="checkbox" id="themeToggle">
                        <span class="theme-slider"></span>
                    </label>
                    <span class="theme-icon" aria-hidden="true">
                        <span class="ui-icon">
                            <svg viewBox="0 0 24 24" fill="none">
                                <path d="M20 14.2A8.5 8.5 0 0 1 9.8 4 8.5 8.5 0 1 0 20 14.2Z"></path>
                            </svg>
                        </span>
                    </span>
                </div>
            </div>

            <form id="registerForm">
                <div class="mb-3">
                    <label for="name" class="form-label">Nome</label>
                    <input type="text" id="name" class="form-control" required>
                    <div class="invalid-feedback d-block" id="error-name"></div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" id="email" class="form-control" required>
                    <div class="invalid-feedback d-block" id="error-email"></div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" id="password" class="form-control" required>
                    <div class="invalid-feedback d-block" id="error-password"></div>
                </div>

                <div class="mb-3">
                    <label for="password_confirmation" class="form-label">Confirmar senha</label>
                    <input type="password" id="password_confirmation" class="form-control" required>
                    <div class="invalid-feedback d-block" id="error-password_confirmation"></div>
                </div>
                <button type="submit" class="btn btn-primary w-100" id="registerButton">Criar conta</button>
            </form>

            <div class="text-center mt-4">
                <span>Ja tem conta?</span>
                <a href="login.html">Fazer login</a>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../assets/js/theme.js?v=20260427-header4"></script>
    <script src="../assets/js/ui.js?v=20260427-header4"></script>
    <script src="../assets/js/auth.js?v=20260427-header4"></script>
    <script>
        $(document).ready(function () {
            initGlobalUI();

            redirectIfAuthenticated();

            $('#registerForm').on('submit', function (e) {
                e.preventDefault();

                $('#registerButton').prop('disabled', true).text('Cadastrando...');

                $.ajax({
                    url: `${API_BASE_URL}/register`,
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    data: {
                        name: $('#name').val(),
                        email: $('#email').val(),
                        password: $('#password').val(),
                        password_confirmation: $('#password_confirmation').val()
                    },
                    success: function (response) {
                        $('#registerButton').prop('disabled', false).text('Cadastrar');

                        showAlert(response.message || 'Cadastro realizado com sucesso. Verifique seu e-mail antes de entrar.', 'success');

                        setTimeout(function () {
                            window.location.href = 'login.html';
                        }, 1500);
                    },
                    error: function (xhr) {
                        $('#registerButton').prop('disabled', false).text('Cadastrar');

                        if (xhr.responseJSON?.errors) {
                            let messages = '';

                            Object.values(xhr.responseJSON.errors).forEach(function (errorArray) {
                                messages += `<div>${errorArray[0]}</div>`;
                            });

                            showAlert(messages, 'danger');
                            return;
                        }

                        showAlert(getErrorMessage(xhr, 'Erro ao cadastrar usuário.'), 'danger');
                    }
                });
            });
        });

        function clearRegisterErrors() {
            $('#registerForm .form-control').removeClass('is-invalid');
            $('#error-name').text('');
            $('#error-email').text('');
            $('#error-password').text('');
            $('#error-password_confirmation').text('');
        }

        function setRegisterFieldError(fieldId, message) {
            $(`#${fieldId}`).addClass('is-invalid');
            $(`#error-${fieldId}`).text(message);
        }

        function validateRegisterForm() {
            clearRegisterErrors();

            let isValid = true;

            const name = $('#name').val().trim();
            const email = $('#email').val().trim();
            const password = $('#password').val();
            const passwordConfirmation = $('#password_confirmation').val();

            if (!name) {
                setRegisterFieldError('name', 'Informe seu nome.');
                isValid = false;
            }

            if (!email) {
                setRegisterFieldError('email', 'Informe seu e-mail.');
                isValid = false;
            } else {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    setRegisterFieldError('email', 'Informe um e-mail válido.');
                    isValid = false;
                }
            }

            if (!password) {
                setRegisterFieldError('password', 'Informe uma senha.');
                isValid = false;
            } else if (password.length < 6) {
                setRegisterFieldError('password', 'A senha deve ter pelo menos 6 caracteres.');
                isValid = false;
            }

            if (!passwordConfirmation) {
                setRegisterFieldError('password_confirmation', 'Confirme sua senha.');
                isValid = false;
            } else if (password !== passwordConfirmation) {
                setRegisterFieldError('password_confirmation', 'A confirmação de senha não confere.');
                isValid = false;
            }

            return isValid;
        }

        function clearFormErrors() {
            $('#registerForm .form-control').removeClass('is-invalid');
            $('#error-name').text('');
            $('#error-email').text('');
            $('#error-password').text('');
            $('#error-password_confirmation').text('');
        }

        function setFieldError(fieldId, message) {
            $(`#${fieldId}`).addClass('is-invalid');
            $(`#error-${fieldId}`).text(message);
        }
        function validateRegisterForm() {
            clearFormErrors();

            let isValid = true;

            const name = $('#name').val().trim();
            const email = $('#email').val().trim();
            const password = $('#password').val();
            const passwordConfirmation = $('#password_confirmation').val();

            if (!name) {
                setFieldError('name', 'Informe seu nome.');
                isValid = false;
            }

            if (!email) {
                setFieldError('email', 'Informe seu e-mail.');
                isValid = false;
            } else {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    setFieldError('email', 'Informe um e-mail válido.');
                    isValid = false;
                }
            }

            if (!password) {
                setFieldError('password', 'Informe uma senha.');
                isValid = false;
            } else if (password.length < 6) {
                setFieldError('password', 'A senha deve ter pelo menos 6 caracteres.');
                isValid = false;
            }

            if (!passwordConfirmation) {
                setFieldError('password_confirmation', 'Confirme sua senha.');
                isValid = false;
            } else if (password !== passwordConfirmation) {
                setFieldError('password_confirmation', 'A confirmação de senha não confere.');
                isValid = false;
            }

            return isValid;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
