<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Confirmação de e-mail</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/theme.css?v=3">

    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-card {
            width: 100%;
            max-width: 480px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            background: #ffffff;
        }

        .dark-mode body {
            background:
                radial-gradient(circle at top left, rgba(59,130,246,0.14), transparent 30%),
                radial-gradient(circle at top right, rgba(236,72,153,0.10), transparent 28%),
                #0f172a;
            color: #e5e7eb;
        }

        .dark-mode .auth-card {
            background-color: #1e293b !important;
            color: #e5e7eb !important;
            border-color: #334155 !important;
            box-shadow: 0 18px 40px rgba(0,0,0,0.35);
        }

        .dark-mode .text-muted,
        .dark-mode p,
        .dark-mode span,
        .dark-mode a,
        .dark-mode h1 {
            color: #e5e7eb !important;
        }

        .status-icon {
            font-size: 52px;
            line-height: 1;
        }
    </style>
</head>
<body class="bg-light">
    <div class="auth-wrapper">
        <div class="card auth-card">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="mb-0 h3">Confirmação de e-mail</h1>

                    <div class="theme-switch-wrapper">
                        <span class="theme-icon">☀️</span>
                        <label class="theme-switch">
                            <input type="checkbox" id="themeToggle">
                            <span class="theme-slider"></span>
                        </label>
                        <span class="theme-icon">🌙</span>
                    </div>
                </div>

                <div class="text-center">
                    <div class="status-icon mb-3" id="statusIcon">📩</div>
                    <h2 class="h4 mb-3" id="statusTitle">Verificando...</h2>
                    <p class="text-muted mb-4" id="statusMessage">
                        Estamos processando a confirmação do seu e-mail.
                    </p>

                    <div class="d-grid gap-2">
                        <a href="login.html" class="btn btn-primary">Ir para o login</a>
                        <a href="register.html" class="btn btn-outline-secondary">Voltar ao cadastro</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../assets/js/theme.js?v=3"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function () {
            if (typeof initThemeToggle === 'function') {
                initThemeToggle();
            }

            const params = new URLSearchParams(window.location.search);
            const status = params.get('status');

            const statusIcon = document.getElementById('statusIcon');
            const statusTitle = document.getElementById('statusTitle');
            const statusMessage = document.getElementById('statusMessage');

            if (status === 'success') {
                statusIcon.textContent = '✅';
                statusTitle.textContent = 'E-mail confirmado';
                statusMessage.textContent = 'Seu e-mail foi confirmado com sucesso. Agora você já pode fazer login.';
            } else if (status === 'already-verified') {
                statusIcon.textContent = 'ℹ️';
                statusTitle.textContent = 'E-mail já confirmado';
                statusMessage.textContent = 'Esse e-mail já havia sido verificado anteriormente.';
            } else {
                statusIcon.textContent = '⚠️';
                statusTitle.textContent = 'Link inválido ou expirado';
                statusMessage.textContent = 'Não foi possível confirmar seu e-mail com esse link.';
            }
        });
    </script>
</body>
</html>
